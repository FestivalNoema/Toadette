<html>
<head>Toadette</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
  <a-scene>
        <a-light type="ambient" color="#FFFFFF" intensity="1.5"></a-light>
        <a-entity obj-model="obj: toa.obj; mtl: toa.mtl" position="0 0 -3" scale="3 3 3" animation_rotation="property: rotation; to: 0 180 0; loop: true; dur: 10000; easing: linear">
        </a-entity>
        <a-plane position="0 -3 -4" rotation="-90 0 0" width="20" height="20" color="#2DFD5B">
        </a-plane>
        <a-sky color="#F17DAE"></a-sky>
        <a-entity   camera  look-controls  wasd-controls position="0 1.5 3">
         </a-entity>
  </a-scene>
</body>
</html><html>
