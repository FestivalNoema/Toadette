<html>
<head>Toadette</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
  <a-scene>
        <a-entity obj-model="obj: toa.obj; mtl: toa.mtl" position="0 0 -3" scale="100 100 100" animation_rotation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        </a-entity>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#7BC8A4">
        </a-plane>
        <a-sky color="#51D1F6"></a-sky>
        <a-entity   camera  look-controls  wasd-controls position="0 0 0">
         </a-entity>
  </a-scene>
</body>
</html><html>
